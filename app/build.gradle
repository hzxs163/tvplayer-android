plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hzxs.tvplayer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hzxs.tvplayer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        // CI 出的是 debug 包：用 Gradle 自带的调试签名，手机允许「安装未知来源」即可装
        debug {
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
