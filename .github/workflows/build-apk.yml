name: 构建 APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # setup-android 偶尔不会带上具体版本的平台，显式装一次并把许可接受掉
      - name: 确认 SDK 组件
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建
        run: gradle --no-daemon assembleDebug

      - name: 产物信息
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          {
            echo "### APK"
            echo
            echo '```'
            sha256sum "$APK"
            echo "大小: $(du -h "$APK" | cut -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: tvplayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
