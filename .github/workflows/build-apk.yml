name: 构建 APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # setup-android 偶尔不会带上具体版本的平台，显式装一次并把许可接受掉
      - name: 确认 SDK 组件
        run: yes | sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # 每次新建 runner 都会现造一个 debug.keystore，签名一变手机就装不上新包
      # （INSTALL_FAILED_UPDATE_INCOMPATIBLE），只能先卸载。缓存住这个目录，
      # 以后出的包都是同一个签名，直接覆盖安装就行。
      - name: 复用调试签名
        uses: actions/cache@v4
        with:
          path: ~/.android
          key: debug-keystore-v1

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 构建
        run: |
          set +e
          gradle --no-daemon --stacktrace assembleDebug > build.log 2>&1
          rc=$?
          # 日志原文只有仓库管理员能下载，这里把关键错误行发成 check-run 注解，
          # 注解是公开 API 可读的，否则远程排查只能靠人肉复制报错。
          {
            awk '/^e: /' build.log
            sed -n '/^\* What went wrong/,/^\* Try:/p' build.log
            grep -E '^(FAILURE|> Task .* FAILED|error:)' build.log
          } | head -n 25 > notes.txt
          if [ ! -s notes.txt ]; then tail -n 15 build.log > notes.txt; fi
          while IFS= read -r line; do
            printf '::error::%s\n' "$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')"
          done < notes.txt
          exit $rc

      # 版本号只在 app/build.gradle 里维护一份，这里读出来当文件名。
      # 先把引号全剥掉再按字段取，这样 versionName '1.0.4' 和 versionName "1.0.4" 都能认。
      - name: 按版本号命名产物
        run: |
          VER=$(tr -d "'\"" < app/build.gradle | awk '$1=="versionName"{print $2; exit}')
          if [ -z "$VER" ]; then echo "没从 app/build.gradle 里读到 versionName" >&2; exit 1; fi
          echo "APP_VERSION=$VER" >> "$GITHUB_ENV"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TVPlayer-v$VER.apk"

      - name: 产物信息
        run: |
          APK="dist/TVPlayer-v$APP_VERSION.apk"
          ls -l "$APK"
          {
            echo "### APK"
            echo
            echo "TVPlayer-v$APP_VERSION.apk"
            echo
            echo '```'
            sha256sum "$APK"
            echo "大小: $(du -h "$APK" | cut -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TVPlayer-v${{ env.APP_VERSION }}
          path: dist/TVPlayer-v${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 30
